[package]
name = "mdreader"
version = "0.1.0"
edition = "2021"
description = "MDreader — native Linux Markdown reader (GTK4 + WebKitGTK)"
license = "MIT"
authors = ["Liang Li"]

[[bin]]
name = "mdreader"
path = "src/bin_gui/mdreader.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:webkit6", "dep:glib", "dep:gio", "dep:glib-build-tools"]

[dependencies]
# Shared pure-logic core (owned by the tui/ crate, exposed as lib `mdreader_core`).
# The package is `mdreader-tui` but its lib target is named `mdreader_core`.
mdreader_core = { package = "mdreader-tui", path = "../tui" }
# GUI (feature-gated)
gtk = { version = "0.6", package = "gtk4", optional = true }
webkit6 = { version = "0.1", optional = true }
glib = { version = "0.17", optional = true }
gio = { version = "0.17", optional = true }

[build-dependencies]
glib-build-tools = { version = "0.17", optional = true }

[profile.release]
opt-level = 2
