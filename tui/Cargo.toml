[package]
name = "mdreader-tui"
version = "0.1.0"
edition = "2021"
description = "MDreader — cross-platform terminal Markdown reader (macOS/Linux)"
license = "MIT"
authors = ["Liang Li"]

[lib]
name = "mdreader_core"
path = "src/lib.rs"

[[bin]]
name = "mdreader-tui"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ratatui = "0.28"
crossterm = "0.28"
pulldown-cmark = "0.12"
unicode-width = "0.2"

[profile.release]
opt-level = 2
